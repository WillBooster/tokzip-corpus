name: Validate corpus

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run validate
